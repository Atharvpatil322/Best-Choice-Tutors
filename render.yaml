services:
  - type: web
    name: best-choice-tutors-api
    runtime: node
    rootDir: backend
    autoDeploy: true
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_BUCKET_NAME
        sync: false
      - key: AWS_S3_ACCESS_POINT_ARN
        sync: false
      - key: BANK_DETAILS_ENCRYPTION_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

  - type: web
    name: Best-Choice-Tutors-FE
    runtime: static
    rootDir: frontend
    autoDeploy: true
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: VITE_API_BASE_URL
        sync: false
      # Origin the build pulls robots.txt, sitemap.xml and llms.txt from, so the
      # static site publishes the database-driven versions instead of the
      # committed fallbacks. Defaults to VITE_API_BASE_URL without /api.
      - key: SEO_SOURCE_ORIGIN
        sync: false
      - key: VITE_ASSET_BASE_URL
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
    # Order matters: Render applies the first matching rule.
    #
    # The build pre-renders one ready-made HTML file per public route, each
    # carrying its own title, description and canonical. Without the explicit
    # rules below, the catch-all rewrote every URL to the homepage shell, so
    # those files were built and never served - and every page told crawlers
    # its canonical was the homepage, which invites search engines to drop the
    # page as a duplicate. Anything that does not run JavaScript, including
    # social link previews, saw the homepage title on every page.
    #
    # Each source matches that exact path only, so /blog/<slug> and every other
    # dynamic route still falls through to the SPA shell at the end.
    # Keep this list in step with the `routes` array in vite.config.js.
    routes:
      - type: rewrite
        source: /about
        destination: /about/index.html
      - type: rewrite
        source: /contact
        destination: /contact/index.html
      - type: rewrite
        source: /how-it-works
        destination: /how-it-works/index.html
      - type: rewrite
        source: /privacy
        destination: /privacy/index.html
      - type: rewrite
        source: /terms
        destination: /terms/index.html
      - type: rewrite
        source: /blog
        destination: /blog/index.html
      - type: rewrite
        source: /tutors
        destination: /tutors/index.html
      # Everything else - dynamic routes, signed-in areas, unknown paths - is
      # handled by the single-page app.
      - type: rewrite
        source: /*
        destination: /index.html
